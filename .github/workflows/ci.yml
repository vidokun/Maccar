name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and audit
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Verify shell script syntax
        run: |
          set -euo pipefail
          for script in maccar.sh install.sh scripts/*.sh; do
            bash -n "$script"
            echo "syntax ok: $script"
          done

      - name: Run the Swift test suite
        run: ./maccar.sh test

      - name: Build the app bundle
        run: ./scripts/package_app.sh

      # The landing page moved to its own repository, where its audit now runs.
      - name: Verify generated manifest tooling
        run: ./scripts/generate_manifest.sh --help > /dev/null
