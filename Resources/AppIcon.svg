<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1D24"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Aluminum Metallic Gradient for Mac mini -->
    <linearGradient id="aluminumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E5EC"/>
      <stop offset="50%" stop-color="#B8BCC6"/>
      <stop offset="100%" stop-color="#8E93A0"/>
    </linearGradient>

    <!-- iPad Chassis Gradient -->
    <linearGradient id="ipadChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3038"/>
      <stop offset="100%" stop-color="#16171B"/>
    </linearGradient>

    <!-- iPad Screen Active Display Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="40%" stop-color="#00D2FF"/>
      <stop offset="75%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Glowing Bridge Arc Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="screenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Base Icon Surface -->
  <rect x="44" y="44" width="936" height="936" rx="218" ry="218" fill="url(#bgGrad)"/>
  <rect x="44" y="44" width="936" height="936" rx="218" ry="218" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="12"/>

  <!-- 2. Ambient Screen Glow in Background -->
  <circle cx="680" cy="460" r="260" fill="#00D2FF" opacity="0.12" filter="url(#screenGlow)"/>

  <!-- 3. Mac Mini Chassis (Aluminum Base) -->
  <!-- Shadow -->
  <rect x="150" y="690" width="440" height="130" rx="36" ry="36" fill="#000000" opacity="0.45" filter="url(#glow)"/>
  <!-- Aluminum body -->
  <rect x="150" y="680" width="440" height="124" rx="32" ry="32" fill="url(#aluminumGrad)"/>
  <!-- Front seam highlight -->
  <rect x="154" y="684" width="432" height="6" rx="3" ry="3" fill="rgba(255, 255, 255, 0.45)"/>
  <!-- Power LED Indicator (Electric Cyan Glow) -->
  <circle cx="530" cy="742" r="7" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="530" cy="742" r="4.5" fill="#FFFFFF"/>

  <!-- 4. Dynamic Bridge / Display Link Beam -->
  <path d="M 370 680 C 370 540, 480 500, 520 480" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 5. iPad Tablet (Standing Display on Right) -->
  <!-- iPad Shadow -->
  <rect x="470" y="210" width="390" height="540" rx="46" ry="46" fill="#000000" opacity="0.55" filter="url(#glow)"/>
  <!-- iPad Bezel -->
  <rect x="470" y="200" width="390" height="540" rx="42" ry="42" fill="url(#ipadChassis)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- iPad Active Display Screen -->
  <rect x="496" y="226" width="338" height="488" rx="24" ry="24" fill="url(#screenGrad)"/>
  <!-- Internal Screen Gloss Highlight -->
  <path d="M 496 226 L 834 226 L 834 330 L 496 480 Z" fill="rgba(255, 255, 255, 0.08)"/>

  <!-- Camera / Dynamic Island Sensor on iPad -->
  <circle cx="665" cy="213" r="5" fill="#0D0E12"/>

  <!-- 6. Maccar Branding Monogram Overlay (Bottom Right subtle) -->
  <text x="500" y="910" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" opacity="0.85" letter-spacing="4" text-anchor="middle">MACCAR</text>
</svg>
